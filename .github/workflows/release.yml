name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: python3 -m unittest discover -s app/runtime/bridge -p 'test_*.py'
      - run: npm run package
      - name: Archive macOS app
        run: ditto -c -k --keepParent "out/Desktop Dragon-darwin-arm64/Desktop Dragon.app" "out/desktop-dragon-${VERSION}-macos-arm64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "out/desktop-dragon-${VERSION}-macos-arm64.zip" \
            --draft --verify-tag --title "Desktop Dragon $VERSION" \
            --notes-file "docs/releases/${VERSION}.md" "${release_flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false "${release_flags[@]}"
