<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞行 · 已采纳60fps</title>
<style>
body{max-width:860px;margin:32px auto;padding:0 24px;background:#211e2b;color:#ece6f4;font:15px/1.7 system-ui,sans-serif}h1{font-size:25px}a{color:#cab6eb}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#4a3b60;color:inherit;border:1px solid #7d6898;border-radius:8px;padding:8px 14px;font:inherit}button{cursor:pointer}button:disabled,select:disabled{opacity:.5}#viewport{overflow:auto;margin:20px 0;border:1px solid #6d5b7f;border-radius:12px;background:#2b2636}#viewport.light{background:#eee8f3}#stage{position:relative;margin:auto}video{display:block}p{color:#c9bfd4}
</style>
<h1>飞行 · 已采纳60fps</h1>
<p>完整60fps飞行动作，以1.5倍速播放，实际约3.22秒。视频原时长约4.83秒，可使用视频控件暂停、继续和查看进度。</p>
<div class="tools">
 <button id="replay" disabled>重播</button>
 <label>方向 <select id="side" disabled><option value="right">向右</option><option value="left">向左</option></select></label>
 <button id="background">浅色背景</button>
 <a href="../runtime/index.html">返回人物预览</a>
</div>
<div id="viewport"><div id="stage"><video id="flight" controls muted playsinline></video></div></div>
<p id="status" role="status">正在载入已采纳的飞行动作…</p>
<script type="module">
import {createFlightScene,flightLayout} from '../../assets/animations/flight/chibi/scene.js';
import {displaySize} from '../runtime/display-policy.js';
const $=id=>document.getElementById(id),video=$('flight');
let scene;
function layout(){
 const options={size:displaySize('flight','chibi'),side:$('side').value,eye:{x:0,y:0}};
 const frame=flightLayout(options);
 scene.layout({...options,eye:{x:-frame.left,y:-frame.top}});
 Object.assign($('stage').style,{width:`${frame.width}px`,height:`${frame.height}px`});
 video.style.pointerEvents='auto';
}
async function restart(play){
 $('replay').disabled=$('side').disabled=true;
 try{
  await scene.prepare();layout();
  if(play)await scene.play();
  else $('status').textContent='首帧已就绪，点击视频播放或“重播”。';
 }catch(error){$('status').textContent=`飞行未能播放：${error.message}`;}
 finally{$('replay').disabled=$('side').disabled=false;}
}
try{
 scene=await createFlightScene({video,onEnded:()=>{$('status').textContent='飞行已完成，人物已完整离屏。点击“重播”再次观看。';}});
 layout();$('replay').disabled=$('side').disabled=false;
 $('status').textContent=`60fps已载入 · ${video.videoWidth} × ${video.videoHeight} · 1.5倍速，播放约${(video.duration/video.playbackRate).toFixed(2)}秒。点击播放。`;
 $('replay').onclick=()=>restart(true);
 $('side').onchange=()=>restart(false);
 video.addEventListener('play',()=>{$('status').textContent=`正在播放 · ${$('side').value==='left'?'向左':'向右'}飞行`;});
 video.addEventListener('pause',()=>{if(!video.ended)$('status').textContent='已暂停，可使用视频控件继续播放。';});
}catch(error){$('status').textContent=`飞行未能载入：${error.message}`;}
$('background').onclick=event=>{const light=$('viewport').classList.toggle('light');event.target.textContent=light?'深色背景':'浅色背景';};
document.addEventListener('visibilitychange',()=>{if(document.hidden)scene?.pause();});
addEventListener('pagehide',event=>{scene?.pause();if(!event.persisted)scene?.destroy();});
</script>
</html>
