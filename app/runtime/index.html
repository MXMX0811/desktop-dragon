<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龙娘 · 动画展示</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../../assets/shared/subagents/style.css"></head>
<body><main>
 <header class="page-header">
  <div><span class="eyebrow">DRAGON COMPANION</span><h1>龙娘 · 动画展示</h1><p>选择她此刻的状态，看看她如何回应你。</p></div>
  <label class="source-control">展示来源<select id="source"><option value="demo">状态演练</option><option value="local">本地会话</option></select></label>
 </header>
 <div class="workspace">
  <aside id="demo-panel" class="panel state-panel" aria-label="动画状态">
   <div class="panel-title"><h2>选择状态</h2><span>当前动画</span></div>
   <div id="states" aria-label="选择演练状态">
    <section class="state-group"><h3>陪伴</h3><div class="companion-states">
     <button data-state="standby"><strong>待机</strong><span>呼吸与眨眼</span></button>
     <button data-state="sleep"><strong>休眠</strong><span>点击后掩嘴哈欠</span></button>
     <button data-state="thinking"><strong>思考</strong><span>站立思索</span></button>
    </div></section>
    <section class="state-group"><h3>任务</h3>
     <div class="task-row"><button data-state="reading"><strong>阅读</strong><span>翻阅书本</span></button><button class="wait-button" data-state="reading-wait" aria-label="阅读待确认">待确认</button></div>
     <div class="task-row"><button data-state="work"><strong>工作</strong><span>敲键与运行终端</span></button><button class="wait-button" data-state="work-wait" aria-label="工作待确认">待确认</button></div>
     <div class="task-row"><button data-state="drawing"><strong>绘图</strong><span>执笔与浮现的图稿</span></button><button class="wait-button" data-state="drawing-wait" aria-label="绘图待确认">待确认</button></div>
    </section>
   </div>
   <details class="flow-controls"><summary>连续流程与结果</summary>
    <div class="controls"><label>流程<select id="scenario"><option value="rest">休眠与唤醒</option><option value="complete">完整任务</option><option value="reading">阅读等待确认</option><option value="drawing">读取参考后绘图</option><option value="concurrent">并发工具与旧事件</option><option value="disconnect">断开与恢复</option></select></label><div class="button-row"><button id="run">播放流程</button><button id="stop" disabled>停止演练</button></div><span id="progress" role="status"></span></div>
    <div class="result-states"><button data-state="complete">完成</button><button data-state="cancel">取消</button></div>
    <p>演练只切换画面，不控制客户端。</p>
   </details>
  </aside>
  <aside id="local-panel" class="panel state-panel" hidden><h2>本地会话</h2><p id="session-label">等待接入文件…</p><p>跟随同一会话的活动与请求。需要批准或回答时，请回到原客户端处理。</p><a href="README.md">接入说明与当前能力</a></aside>
  <section class="viewer" aria-label="当前动画预览">
   <div class="viewer-heading"><div><span class="eyebrow">正在展示</span><h2 id="scene-title">待机陪伴</h2></div><span id="form-label" class="form-tag">Q版</span></div>
   <div class="toolbar" aria-label="动画控制">
    <button id="touch">摸摸她</button><button id="pause" aria-pressed="false">暂停动画</button><button id="switch-form" disabled>切换比例</button><button id="background">浅色背景</button><a id="review-current" href="inspect.html?scene=standby&form=chibi">放大审阅 ↗</a>
    <label id="subagent-control" class="subagent-control" hidden><input id="subagents" type="checkbox" disabled>子代理活动<span>演练</span></label>
   </div>
   <section id="stage" aria-label="龙娘动画">
    <div id="characters"></div><div id="cloud" hidden></div>
    <div id="menu" role="menu" aria-label="切换形象" hidden><button id="change-form" role="menuitem">切换形象</button></div>
   </section>
   <section class="status-row" aria-live="polite"><span id="mode-badge">演练</span><strong id="status">准备陪伴…</strong><button id="read-result" hidden>已查看结果</button></section>
   <p id="hint">点击她，看看她的回应。</p>
   <p id="error" role="alert" hidden></p>
   <details id="helper-review" hidden><summary>小助手逐帧审阅</summary><p>16帧检查出入场或完整环绕，仅固定小助手的位置。</p><label>检查动作<select id="helper-action"><option value="entry">飘出、漂浮与退出</option><option value="orbit">双云同步环绕一圈</option></select></label><div id="helper-frames" class="button-row"></div><button id="helper-resume">恢复小助手动画</button><output id="helper-frame-label"></output></details>
   <div class="viewer-footer"><span>思考/拖动 80% · 起飞 76% · 其余 90%</span><span>阅读、工作、绘图可切换比例</span></div>
  </section>
 </div>
 <details id="activity"><summary>会话活动与事件记录</summary><p id="facts"></p><ol id="events"></ol></details>
</main><script src="../../assets/vendor/pixi.min.js"></script><script type="module" src="app.js"></script></body></html>
